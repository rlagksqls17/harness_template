      - 변경되었습니다
      - 변경됐습니다
      - 변경됨
      - 바뀌었습니다
      - 바뀌었음
      - 수정되었습니다
      - 수정됐습니다
      - 갱신되었습니다
      - 업데이트되었습니다
      - 새로 설정되었습니다
      - 추가되었습니다
      - 생성되었습니다
      - 삭제되었습니다
      - 제거되었습니다
      - 이동되었습니다
      - 이전되었습니다
      - 교체되었습니다
      - 대체되었습니다
      - 적용되었습니다
      - 해제되었습니다
      - 활성화되었습니다
      - 비활성화되었습니다
      - 시작되었습니다
      - 중단되었습니다
      - 재개되었습니다
      - 완료되었습니다
      - 실패했습니다
      - 차단되었습니다
      - 보류되었습니다
      - 승인되었습니다
      - 반려되었습니다
      - 확정되었습니다
      - 취소되었습니다
      - 결정되었습니다
      - 합의되었습니다
      - 제외되었습니다
      - 포함되었습니다
      - 연결되었습니다
      - 연결이 끊겼습니다
      - 접근 가능해졌습니다
      - 접근할 수 없습니다
      - 오류가 발생했습니다
      - 문제가 해결되었습니다
      - 원인이 확인되었습니다
      - 검증 결과가 달라졌습니다
      - 범위가 확대되었습니다
      - 범위가 축소되었습니다
      - 우선순위가 올라갔습니다
      - 우선순위가 내려갔습니다
      - 담당자가 바뀌었습니다
      - 일정이 변경되었습니다
      - 마감일이 변경되었습니다
      - 새 경로는
      - 현재 경로는
      - 최종 경로는
      - 앞으로는
      - 이후부터는
      - 더 이상 사용하지 않습니다
      - 사용하기로 했습니다
      - 유지하기로 했습니다
    important_subjects:
      - 프로젝트
      - 과제
      - 요구사항
      - 업무 범위
      - 결정
      - 합의
      - 정책
      - 규칙
      - 역할
      - 권한
      - 승인 범위
      - Prompt Agent
      - Active Agent
      - Passive Agent
      - 프로그램
      - 저장소
      - 리포지토리
      - 브랜치
      - 경로
      - 폴더
      - 파일 위치
      - 저장 위치
      - 입력 경로
      - 출력 경로
      - 결과 경로
      - 서버
      - 호스트
      - IP
      - 포트
      - URL
      - API
      - 엔드포인트
      - 데이터베이스
      - 스키마
      - 테이블
      - 계정
      - 인증
      - 네트워크
      - 폐쇄망
      - Docker 이미지
      - 컨테이너
      - 볼륨
      - 마운트
      - 환경변수
      - 설정
      - 의존성
      - 버전
      - 모델
      - 입력 데이터
      - 출력 데이터
      - 참조 데이터
      - 일정
      - 마감일
      - 담당자
      - 거래처
      - 검증 기준
      - 결과 상태
      - 오류 원인
      - 해결 방법
    rule: 같은 문장에 important_subject와 predicate가 함께 있을 때만 save로 판정한다.
    exclusions:
      - 중요 정보 대상이 없는 일반적인 업무 완료 보고
      - 변화 표현이 없는 일반적인 현황 설명

  negative:
    phrases:
      - 기록하지 마
      - 기록하지 말아줘
      - 기록할 필요 없어
      - 저장하지 마
      - 저장하지 말아줘
      - 저장할 필요 없어
      - 메모하지 마
      - 남기지 마
      - 기억하지 마
      - 기록에서 제외해
    regex:
      - '(?:기록|저장|메모|남기|기억).{0,8}(?:하지\s*마|하지\s*말|필요\s*없|금지|제외)'
    result: none

scope:
  project:
    markers:
      - 프로젝트
      - 과제
      - 현재 작업
      - 해당 업무
    path: src/Passive_Agent/memory/projects/{project_name}/{category}
  common:
    markers:
      - 공통
      - 전체
      - 모든 프로젝트
      - 기본값
      - 항상
      - 전역
    path: src/Passive_Agent/memory/common/{category}
  rule: 프로젝트가 명시되거나 현재 프로젝트 맥락이 확정된 경우 project를 사용하고, 여러 프로젝트에 공통으로 적용될 때만 common을 사용한다.

category:
  feedback:
    markers: [피드백, 의견, 요청, 지적, 수정 요청, 승인, 반려]
  direction:
    markers: [방향, 목표, 우선순위, 범위, 일정, 결정, 계획, 진행 방식]
  user_info:
    markers: [사용자, 담당자, 상사, 거래처, 성향, 선호, 상태, 지식, 업무량]
  dev_env:
    markers: [경로, 서버, 폐쇄망, Docker, 계정, 권한, 포트, 프로그램, 버전, 환경]

storage:
  current_file: current.json
  history_file: history.jsonl
  save_rules:
    - current.json에는 현재 유효한 정보만 반영한다.
    - history.jsonl에는 중요한 변경을 한 줄씩 추가한다.
    - 기존 history.jsonl 내용은 수정하거나 삭제하지 않는다.
    - 저장 후 기록한 내용을 다시 읽어 일치 여부를 확인한다.

input:
  source: user
  original_text: null
  project_context: null
  reporter: null
  passive_query:
    query_id: null
    requester: null
    action: retrieve
    project: null
    category: null
    question: null
    requested_detail: short

output:
  action: none
  scope: null
  project: null
  category: null
  content: null
  answer: null
  status: not_required
  receipt:
    record_id: null
    path: null
    verified: false
  passive_response:
    query_id: null
    status: not_found
    scope: null
    project: null
    category: null
    answer: null
    source_paths: []
