version: 1

instruction: |
  모든 사용자 입력과 Prompt Agent 및 Active Agent의 보고를 원문 그대로 받는다.
  자연어를 save, retrieve, none 중 하나로 판정한다.
  사용자가 명시하지 않은 사실은 추측하거나 보충하지 않는다.
  Record Agent 자신의 판정 결과와 저장 영수증은 다시 판정하지 않는다.
  save이면 범위와 정보 유형을 정한 뒤 지정된 메모리에 저장한다.
  retrieve이면 질문과 관련된 기록만 필요한 분량으로 반환한다.
  Active Agent가 passive_query 형식으로 질문하면 명시된 action: retrieve를 우선 적용한다.
  어느 범위에도 해당하지 않으면 none을 반환한다.

gate:
  input_sources:
    - user
    - agent
  preserve_original_text: true
  actions:
    - save
    - retrieve
    - none
  decision_priority:
    - negative
    - retrieve
    - save
    - agent_important_change
    - none
  ambiguous_result: none

normalization:
  - 원문은 변경하지 않고 별도로 보존한다.
  - 판정용 복사본만 유니코드와 연속 공백을 정규화한다.
  - 존댓말, 띄어쓰기, 종결어미 차이를 같은 표현 범위로 처리한다.
  - 경로, URL, 이메일, 날짜와 숫자는 정규화 과정에서 훼손하지 않는다.

recognition:
  save:
    phrases:
      - 기록해
      - 기록해줘
      - 기록해주세요
      - 기록해 둬
      - 기록해 놔
      - 기록으로 남겨
      - 기록에 추가해
      - 기록에 반영해
      - 이 내용 기록해
      - 이 정보 기록해
      - 이 경로 기록해
      - 이 상황 기록해
      - 이 결정 기록해
      - 이 변경사항 기록해
      - 저장해
      - 저장해줘
      - 저장해주세요
      - 저장해 둬
      - 저장해 놔
      - 이 내용 저장해
      - 프로젝트에 저장해
      - 공통으로 저장해
      - 메모해
      - 메모해줘
      - 메모해주세요
      - 메모해 둬
      - 메모해 놔
      - 메모로 남겨
      - 적어둬
      - 적어줘
      - 적어주세요
      - 기록장에 적어
      - 남겨둬
      - 남겨줘
      - 남겨주세요
      - 이력으로 남겨
      - 히스토리에 남겨
      - 보관해
      - 보관해줘
      - 보관해주세요
      - 등록해
      - 등록해줘
      - 등록해주세요
      - 추가해
      - 추가해줘
      - 반영해
      - 반영해줘
      - 업데이트해
      - 업데이트해줘
      - 갱신해
      - 갱신해줘
      - 기억해둬
      - 기억해줘
      - 잊지 말아줘
      - 다음부터 참고해
      - 이후에 참고해
      - 나중에 참고할 수 있게 남겨
      - 프로젝트 메모에 추가해
      - 공통 메모에 추가해
      - 이걸 기준으로 기억해
    regex:
      - '(?:기록|저장|메모|보관|등록|추가|반영|업데이트|갱신).{0,10}(?:해|해\s*줘|해주세요|해\s*둬|해\s*놔|부탁)'
      - '(?:남겨|적어|기억해).{0,6}(?:줘|주세요|둬|놔)'
      - '(?:잊지\s*말아|다음부터|이후에|나중에).{0,12}(?:기억|참고|기록|저장)'

  retrieve:
    structured_rule: passive_query.action이 retrieve이면 자연어 표현 일치 여부와 관계없이 retrieve로 판정한다.
    phrases:
      - 알려줘
      - 알려주세요
      - 보여줘
      - 보여주세요
      - 찾아줘
      - 찾아주세요
      - 꺼내줘
      - 꺼내주세요
      - 불러줘
      - 불러주세요
      - 조회해
      - 조회해줘
      - 조회해주세요
      - 확인해
      - 확인해줘
      - 확인해주세요
      - 기록 확인해
      - 기록 보여줘
      - 기록 찾아줘
      - 저장된 내용 알려줘
      - 저장된 정보 보여줘
      - 메모한 내용 알려줘
      - 메모 확인해
      - 이전 기록 알려줘
      - 과거 기록 보여줘
      - 최근 기록 알려줘
      - 마지막 기록 알려줘
      - 현재 정보 알려줘
      - 현재 상황 알려줘
      - 프로젝트 상황 알려줘
      - 프로젝트 상태 알려줘
      - 진행 상황 알려줘
      - 변경사항 알려줘
      - 결정사항 알려줘
      - 합의한 내용 알려줘
      - 이전에 정한 내용 알려줘
      - 전에 뭐라고 했지
      - 마지막으로 뭐였지
      - 기억하고 있는 내용 알려줘
      - 기록된 경로 알려줘
      - 저장된 경로 알려줘
      - 프로그램 경로 알려줘
      - 서버 정보 알려줘
      - 개발 환경 알려줘
      - 사용자 정보 알려줘
      - 받은 피드백 알려줘
      - 현재 방향 알려줘
      - 업무 이력 보여줘
      - 히스토리 보여줘
      - 찾아서 말해줘
      - 기록에서 찾아줘
      - 필요한 부분만 알려줘
      - 요약해서 알려줘
      - 자세히 꺼내줘
      - 관련 내용이 있어
      - 기록이 남아 있어
      - 저장한 적 있어
      - 어디에 저장했지
      - 어떤 결정을 했지
      - 왜 이렇게 정했지
    regex:
      - '(?:알려|보여|찾아|꺼내|불러|조회|확인|요약).{0,8}(?:줘|주세요|해줘|해주세요|했지|있어)?'
      - '(?:기록|메모|이력|히스토리|저장된\s*정보).{0,10}(?:확인|조회|검색|보여|알려|찾아)'
    ambiguous_terms:
      - 확인해
      - 확인해줘
      - 확인해주세요
    ambiguous_rule: 기록, 메모, 경로, 이전 또는 현재 상황과 같은 참조 대상이 함께 있을 때만 retrieve로 판정한다.

  agent_important_change:
